services:
  media-storage:
    ports:
      - "9000:9000"
      - "9001:9001"

  user-mongo:
    ports:
      - "27017:27017"

  product-mongo:
    ports:
      - "27018:27017"

  media-mongo:
    ports:
      - "27019:27017"

  discovery-service:
    ports:
      - "${EUREKA_PORT:-8761}:8761"

  user-service:
    ports:
      - "${USER_SERVICE_PORT:-8081}:8080"

  product-service:
    ports:
      - "${PRODUCT_SERVICE_PORT:-8082}:8080"

  media-service:
    ports:
      - "${MEDIA_SERVICE_PORT:-8083}:8080"

  api-gateway:
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
