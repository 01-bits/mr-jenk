jenkins:
  systemMessage: "Jenkins managed via Configuration as Code"
  numExecutors: 0
  
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: ${JENKINS_USER}
          password: ${JENKINS_PASSWORD}

  remotingSecurity:
    enabled: true

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  nodes:
    - permanent:
        name: "agent-docker"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 2
        labelString: "docker-agent"
        mode: "NORMAL"
        launcher:
          inbound: {}

unclassified:
  location:
    url: "http://jenkins-master:8080/"