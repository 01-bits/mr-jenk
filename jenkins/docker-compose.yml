services:
  jenkins-master:
    build:
      context: .
      dockerfile: jenkins-server/Dockerfile
    container_name: jenkins_server
    environment:
      - JENKINS_ADMIN_USERNAME=${JENKINS_ADMIN_USERNAME:?}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:?}
      - JENKINS_AGENT_USERNAME=${JENKINS_AGENT_USERNAME:?}
      - JENKINS_AGENT_PASSWORD=${JENKINS_AGENT_PASSWORD:?}
      - GITHUB_USER=${GITHUB_USERNAME:?}
      - GITHUB_USER=${GITHUB_TOKEN:?}
      - REPO_URL=${REPO_URL:?}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:?}
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins.yaml:/var/jenkins_home/jenkins.yaml
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  jenkins-agent:
    build: ./jenkins-agent
    container_name: jenkins_agents
    depends_on:
      jenkins-master:
        condition: service_healthy
    environment:
      - JENKINS_URL=${JENKINS_URL:?}
      - JENKINS_AGENT_NAME=${JENKINS_AGENT_NAME:?}
      - JENKINS_AGENT_USERNAME=${JENKINS_AGENT_USERNAME:?}
      - JENKINS_AGENT_PASSWORD=${JENKINS_AGENT_PASSWORD:?}
    restart: unless-stopped
    volumes:
      - ${ACTIVE_SOCK:?}:/var/run/docker.sock
volumes:
  jenkins_home:
