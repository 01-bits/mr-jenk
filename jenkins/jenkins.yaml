jenkins:
  systemMessage: "Jenkins managed via Configuration as Code"
  numExecutors: 0
  
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USERNAME}"
          password: "${JENKINS_ADMIN_PASSWORD}"
        - id: "${JENKINS_AGENT_USERNAME}"
          password: "${JENKINS_AGENT_PASSWORD}"

  remotingSecurity:
    enabled: true

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            permissions: 
              - "Overall/Administer"
            entries:
              - user: "${JENKINS_ADMIN_USERNAME}"
          - name: "agent"
            permissions:
              - "Overall/Read"
              - "Agent/Connect"
              - "Agent/Disconnect"
              - "Agent/Build"
            entries:
              - user: "${JENKINS_AGENT_USERNAME}"

  nodes:
    - permanent:
        name: "agent-docker"
        remoteFS: "/home/jenkins/agent"
        launcher: inbound
        numExecutors: 2

unclassified:
  location:
    url: "http://jenkins-master:8080/"