jenkins:
  systemMessage: "Jenkins managed via Configuration as Code"
  numExecutors: 0

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USERNAME}"
          password: "${JENKINS_ADMIN_PASSWORD}"
        - id: "${JENKINS_AGENT_USERNAME}"
          password: "${JENKINS_AGENT_PASSWORD}"

  remotingSecurity:
    enabled: true

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "${JENKINS_ADMIN_USERNAME}"
          - name: "agent"
            permissions:
              - "Overall/Read"
              - "Agent/Connect"
              - "Agent/Disconnect"
              - "Agent/Build"
            entries:
              - user: "${JENKINS_AGENT_USERNAME}"

  nodes:
    - permanent:
        name: "agent-docker"
        remoteFS: "/home/jenkins/agent"
        launcher: inbound
        numExecutors: 2

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github-creds
              username: ${GITHUB_USER}
              password: ${GITHUB_TOKEN}
              description: GitHub PAT
          - string:
              scope: SYSTEM
              id: github-webhook-secret
              secret: ${GITHUB_WEBHOOK_SECRET}
              description: GitHub webhook secret

jobs:
  - script: >
      multibranchPipelineJob('mr-jenk') {
        branchSources {
          branchSource {
            source {
              github {
                  id('mr-jenk-github')
                  repoOwner('01-bits')
                  repository('mr-jenk')
                  credentialsId('github-creds')

                  repositoryUrl('https://github.com/01-bits/mr-jenk')
                  configuredByUrl(true)

                  traits {
                    // Discover branches; the filter below keeps only main
                    gitHubBranchDiscovery {
                        strategyId(3)
                    }
                    // Discover PRs from branches in the same repository
                    // Test the proposed merge with the target branch
                    gitHubPullRequestDiscovery {
                      strategyId(1)
                    }
                    // Keep main and PR jobs, not develop/feature branch jobs
                    headWildcardFilter {
                      includes('main PR-*')
                      excludes('')
                    }

                  }
              }
            }
          }
        }

        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }

        orphanedItemStrategy {
          discardOldItems {
            numToKeep(10)
          }
        }
      }

unclassified:
  location:
    url: "http://jenkins-master:8080/"
  gitHubPluginConfig:
    hookSecretConfigs:
      - credentialsId: github-webhook-secret